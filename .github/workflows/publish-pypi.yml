name: Publish PyPI Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/openmanusv2/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Set package version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          python - "${version}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          setup_path = Path("setup.py")
          setup_text = setup_path.read_text(encoding="utf-8")
          updated, replacements = re.subn(
              r'version="[^"]+"',
              f'version="{version}"',
              setup_text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not update package version in setup.py")
          setup_path.write_text(updated, encoding="utf-8")
          PY

      - name: Build distributions
        run: |
          python -m build
          twine check dist/*

      - name: Verify deployment CLI package
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as wheel:
              top_level = {
                  name.split("/", 1)[0]
                  for name in wheel.namelist()
                  if "/" in name
              }
          unexpected = {
              name
              for name in top_level
              if name != "openmanus_cli" and not name.endswith(".dist-info")
          }
          if unexpected:
              raise SystemExit(f"Unexpected wheel contents: {sorted(unexpected)}")
          PY
          python -m venv /tmp/openmanus-package-smoke
          /tmp/openmanus-package-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/openmanus-package-smoke/bin/openmanus --version
          /tmp/openmanus-package-smoke/bin/openmanus --help >/dev/null

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
